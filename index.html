<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disconnect Protection — dj_cheesuslive</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{display:flex;flex-direction:column;position:relative}
    .bg-grid{
      position:fixed;inset:0;pointer-events:none;z-index:0;
      background-image:
        linear-gradient(rgba(34,211,238,0.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(34,211,238,0.025) 1px,transparent 1px);
      background-size:48px 48px
    }
    .top{text-align:center;padding:12px 0 6px;position:relative;z-index:1;flex-shrink:0}
    .top h1{
      font-size:clamp(1.2rem,2vw,1.8rem);font-weight:700;text-transform:uppercase;
      letter-spacing:6px;color:#f87171;
      text-shadow:0 0 20px rgba(248,113,113,0.15)
    }
    .mid{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;min-height:0}
    .player-wrap{width:100%;height:100%;border:1px solid #1e293b;overflow:hidden;position:relative}
    #clip-player{position:absolute;inset:0;width:100%;height:100%;border:0}
    #clip-player .loading,#clip-player .error{
      display:flex;align-items:center;justify-content:center;height:100%;color:#52525b;font-size:0.9rem
    }
    #clip-player video{width:100%;height:100%;object-fit:contain;background:#0e0e0e}
    .bot{text-align:center;padding:6px 0 10px;position:relative;z-index:1;flex-shrink:0}
    .bot .reconnect{
      font-size:clamp(0.9rem,1.5vw,1.3rem);font-weight:600;text-transform:uppercase;
      letter-spacing:3px;color:#22d3ee;
      text-shadow:0 0 20px rgba(34,211,238,0.1)
    }
    .bot .note{font-size:0.65rem;color:#52525b;margin-top:4px}
  </style>
</head>
<body>

<div class="bg-grid"></div>

<div class="top">
  <h1>INGEST OFFLINE</h1>
</div>

<div class="mid">
  <div class="player-wrap">
      <div id="clip-player"><div class="loading">Loading clips...</div></div>
  </div>
</div>

<div class="bot">
  <div class="reconnect">attempting to reconnect</div>
  <div class="note" id="status-note"></div>
</div>

<script>
(function() {
  'use strict';

  var CHANNEL = 'dj_cheesuslive';
  var GQL_URL = 'https://gql.twitch.tv/gql';
  var CLIENT_ID = 'kimne78kx3ncx6brgo4mv6wki5h1ko';

  var clips = [];
  var currentIndex = 0;
  var player = document.getElementById('clip-player');
  var statusNote = document.getElementById('status-note');

  function log(msg) { statusNote.textContent = msg; }
  function show(msg, err) { player.innerHTML = '<div class="' + (err ? 'error' : 'loading') + '">' + msg + '</div>'; }

  function gql(payload) {
    return fetch(GQL_URL, {
      method: 'POST',
      headers: { 'Client-ID': CLIENT_ID, 'Content-Type': 'text/plain; charset=utf-8' },
      body: JSON.stringify(payload),
    }).then(function(r) { return r.json(); });
  }

  function nextClip() {
    currentIndex = (currentIndex + 1) % clips.length;
    loadClip(currentIndex);
  }

  function loadClip(index) {
    currentIndex = index;
    var clip = clips[index];
    if (!clip) { show('No clips', true); return; }

    log((index + 1) + ' / ' + clips.length + ' - fetching...');

    gql({
      operationName: 'VideoAccessToken_Clip',
      variables: { slug: clip.slug },
      extensions: {
        persistedQuery: { version: 1, sha256Hash: '36b89d2507fce29e5ca551df756d27c1cfe079e2609642b4390aa4c35796eb11' }
      }
    }).then(function(json) {
      if (json.errors) {
        return gql({
          query: 'query VideoAccessToken_Clip($slug: ID!) { clip(slug: $slug) { playbackAccessToken(params: {platform: "web", playerBackend: "mediaplayer", playerType: "site"}) { signature value } videoQualities { frameRate quality sourceURL } } }',
          variables: { slug: clip.slug }
        });
      }
      return json;
    }).then(function(json) {
      if (!json || json.errors || !json.data || !json.data.clip) throw new Error(json && json.errors ? json.errors[0].message : 'No clip data');
      var clipData = json.data.clip;
      if (!clipData.playbackAccessToken || !clipData.videoQualities || clipData.videoQualities.length === 0) throw new Error('No playback data');
      var token = clipData.playbackAccessToken;
      var source = clipData.videoQualities[0].sourceURL;
      var mp4Url = source + '?sig=' + encodeURIComponent(token.signature) + '&token=' + encodeURIComponent(token.value);

      player.innerHTML = '<video id="clip-video" autoplay muted style="width:100%;height:100%;object-fit:contain;background:#0e0e0e;"></video>';
      var v = document.getElementById('clip-video');
      v.src = mp4Url;
      v.volume = 1.0;
      v.muted = false;
      v.onended = nextClip;
      v.onerror = function() { log('Error, skipping...'); setTimeout(nextClip, 2000); };
      v.oncanplay = function() { v.play(); v.muted = false; };
      var tries = 0;
      var force = setInterval(function() {
        if (++tries > 20) { clearInterval(force); return; }
        v.muted = false; v.volume = 1.0; v.play();
      }, 500);

      log((index + 1) + ' / ' + clips.length);
    }).catch(function(err) {
      log('failed: ' + err.message);
      setTimeout(nextClip, 3000);
    });
  }

  gql({
    query: 'query{user(login:"' + CHANNEL + '"){clips(first:50){edges{node{slug title createdAt durationSeconds}}}}}'
  }).then(function(json) {
    if (json.errors) throw new Error(json.errors[0].message);
    var edges = json && json.data && json.data.user && json.data.user.clips && json.data.user.clips.edges;
    if (!edges || edges.length === 0) throw new Error('No clips');
    clips = edges.map(function(e) {
      return { slug: e.node.slug, title: e.node.title, created_at: e.node.createdAt };
    }).sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    log(clips.length + ' clips');
    loadClip(0);
  }).catch(function(err) {
    log('failed: ' + err.message);
    show('Could not load clips', true);
  });
})();
</script>

</body>
</html>
